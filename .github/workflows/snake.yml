name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23ff8ff5&color_dots=%23ffffff,%23ffd9fa,%23ffb8f3,%23ff9aec,%23ff8ff5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff8ff5&color_dots=%230d1017,%23161a24,%23212a3a,%232d3a52,%2338486b

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
